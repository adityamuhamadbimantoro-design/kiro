<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <span id="datetime" class="datetime"></span>
    </div>
    <div class="header-right">
      <button id="themeToggle" class="btn-icon" title="Toggle Dark/Light Mode">🌙</button>
    </div>
  </header>

  <!-- GREETING -->
  <section class="card greeting-card">
    <h1 id="greetingText" class="greeting"></h1>
    <div class="name-row">
      <input id="nameInput" type="text" placeholder="Enter your name…" maxlength="30" />
      <button id="saveName" class="btn btn-primary">Save</button>
    </div>
  </section>

  <!-- FOCUS TIMER -->
  <section class="card timer-card">
    <h2 class="section-title">🍅 Focus Timer</h2>
    <div class="timer-settings">
      <label for="pomodoroMinutes">Minutes:</label>
      <input id="pomodoroMinutes" type="number" min="1" max="120" value="25" />
      <button id="applyTime" class="btn btn-secondary">Apply</button>
    </div>
    <div id="timerDisplay" class="timer-display">25:00</div>
    <div class="timer-controls">
      <button id="startTimer" class="btn btn-primary">▶ Start</button>
      <button id="stopTimer" class="btn btn-secondary">⏸ Stop</button>
      <button id="resetTimer" class="btn btn-danger">↺ Reset</button>
    </div>
  </section>

  <!-- TO-DO LIST -->
  <section class="card todo-card">
    <h2 class="section-title">📝 To-Do List</h2>
    <div class="todo-controls">
      <input id="taskInput" type="text" placeholder="Add a new task…" maxlength="100" />
      <button id="addTask" class="btn btn-primary">Add</button>
    </div>
    <div class="sort-row">
      <label for="sortSelect">Sort by:</label>
      <select id="sortSelect">
        <option value="default">Default</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
        <option value="done">Done last</option>
      </select>
    </div>
    <ul id="taskList" class="task-list"></ul>
  </section>

  <!-- QUICK LINKS -->
  <section class="card links-card">
    <h2 class="section-title">🔗 Quick Links</h2>
    <div class="links-add">
      <input id="linkName" type="text" placeholder="Label (e.g. GitHub)" maxlength="30" />
      <input id="linkUrl" type="url" placeholder="https://…" />
      <button id="addLink" class="btn btn-primary">Add</button>
    </div>
    <div id="linksList" class="links-list"></div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
